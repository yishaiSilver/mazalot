# Builds the static site from source and publishes it to GitHub Pages.
#
# The wasm is rebuilt here rather than trusting the copies committed under
# crates/*/web/ — those exist for local dev and go stale silently, so the
# deployed site should never depend on them being current.
name: Deploy site

on:
  push:
    branches: [master]
    # Skip runs that cannot change the site: the generators, their docs and the
    # native-only bins are irrelevant to what gets served.
    paths:
      - "crates/**"
      - "index.html"
      - "scripts/build-site.sh"
      - "scripts/build-wasm.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight build.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Build site
        run: scripts/build-site.sh --out site

      # Fail loudly rather than publishing an empty or half-assembled tree.
      - name: Check the output looks like a site
        run: |
          test -f site/index.html || { echo "no landing page"; exit 1; }
          count=$(find site/demos -name '*.wasm' | wc -l)
          echo "$count wasm modules"
          test "$count" -eq 7 || { echo "expected 7 wasm modules, got $count"; exit 1; }

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
