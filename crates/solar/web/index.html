<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Procedural Solar System — Rust · WASM</title>
<link rel="icon" href="data:," />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05050b;
    color: #d7dae6; font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    /* Lock the page so touch gestures drive the canvas, not the browser. */
    position: fixed; width: 100%; overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block;
    cursor: grab; touch-action: none; background: #05050b;
    /* Upscale the internal buffer as crisp square pixels, not a blur — so the
       "pixel size" slider reads as chunky pixel-art. */
    image-rendering: pixelated; image-rendering: crisp-edges; }
  #stage.drag { cursor: grabbing; }
  /* The WebGL2 canvas is displayed directly, stacked over the 2D one. Copying it
     across with drawImage would be a full-frame GPU->CPU->GPU round trip every
     frame — the very plumbing the GPU path exists to delete, and it pinned the
     demo to a fraction of its rate. `pointer-events: none` lets every drag,
     pinch and tap keep landing on #stage underneath, so the interaction code
     needs no idea which renderer is running. */
  #glstage { position: fixed; inset: 0; width: 100%; height: 100%; display: none;
    pointer-events: none; z-index: 1;
    image-rendering: pixelated; image-rendering: crisp-edges; }

  .hud { position: fixed; pointer-events: none; z-index: 5;
    text-shadow: 0 1px 3px rgba(0,0,0,.9); }
  .topleft { top: 18px; left: 20px; }
  .topleft h1 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .16em;
    text-transform: uppercase; color: #8790ad; }
  .viewing { margin-top: 8px; font-size: 22px; font-weight: 700; color: #eef1f8; text-transform: capitalize;
    min-height: 28px; }
  .viewing small { display: block; font-size: 12px; font-weight: 500; letter-spacing: .04em;
    color: #7b83a2; text-transform: none; margin-top: 2px; }
  .hint { position: fixed; top: 18px; right: 20px; z-index: 5; pointer-events: none;
    font-size: 12px; color: #6b7290; text-align: right; text-shadow: 0 1px 3px rgba(0,0,0,.9); letter-spacing: .03em; }
  .hint b { color: #aeb4cd; font-weight: 600; }

  /* Perf readout — live frame/CPU signal. Click (or press P) to cycle detail. */
  /* Above the dock (z-index 6): the readout is a few narrow lines and the dock
     is tall enough to reach up under them. Click it, or press P, to collapse. */
  .perf { position: fixed; top: 64px; right: 20px; z-index: 7; pointer-events: auto;
    font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #9aa0bb; background: rgba(14,15,24,.74); border: 1px solid rgba(255,255,255,.07);
    border-radius: 9px; padding: 6px 9px; backdrop-filter: blur(6px); cursor: pointer;
    min-width: 140px; max-width: min(300px, 40vw); text-shadow: none; }
  /* A driver's adapter string can be 80 characters of parenthesised detail, and
     an unwrapped one drags the whole panel across the viewport. Clip it to one
     line — the full text is on the element's `title`. */
  .perf .clip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .perf b { color: #eef1f8; font-weight: 600; font-variant-numeric: tabular-nums; }
  .perf .lbl { color: #6b7290; }
  /* A software rasterizer means the page is drawing on the CPU after all, which
     is the one GPU fact worth shouting about. */
  .perf .warn { color: #f4b74a; }
  .perf .bar { height: 4px; border-radius: 3px; margin-top: 6px; background: rgba(255,255,255,.10); overflow: hidden; }
  .perf .bar i { display: block; height: 100%; width: 0; background: #57d38c; transition: width .15s linear, background .3s; }
  .perf.min .detail { display: none; }
  .perf.off { display: none; }

  /* Standalone Generate button (lifted out of the Controls dock). Bottom-left on
     desktop, mirroring the dock; always visible regardless of the dock state. */
  .genfab { position: fixed; left: 16px; bottom: 16px; z-index: 6; font-size: 13px;
    padding: 10px 18px; box-shadow: 0 8px 24px rgba(0,0,0,.55); }

  /* Control dock — docked bottom-right on desktop, collapsible. */
  .dock { position: fixed; right: 16px; bottom: 16px; z-index: 6; width: 268px;
    max-width: calc(100vw - 32px);
    background: rgba(14,15,24,.86); border: 1px solid rgba(255,255,255,.08);
    border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.6); backdrop-filter: blur(9px); }
  .dock-head { display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px; cursor: pointer; user-select: none; }
  .dock-head span { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: #8790ad; }
  .dock-head .chev { color: #8790ad; transition: transform .18s; }
  .dock.collapsed .chev { transform: rotate(180deg); }
  .dock-body { max-height: min(64vh, 560px); overflow-y: auto; overscroll-behavior: contain;
    padding: 2px 14px 14px; }
  .dock.collapsed .dock-body { display: none; }

  .row { display: flex; gap: 8px; align-items: center; }
  .row input[type=number] { flex: 1; }
  .grp { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: #565d78;
    margin: 15px 0 8px; border-top: 1px solid rgba(255,255,255,.07); padding-top: 11px; }
  .ctl { margin: 0 0 10px; }
  .ctl.dim { opacity: .38; pointer-events: none; }
  .ctl label { display: flex; justify-content: space-between; font-size: 12px; color: #9aa0bb; margin-bottom: 4px; }
  .ctl label b { color: #eef1f8; font-variant-numeric: tabular-nums; font-weight: 600; }
  input[type=number] { width: 100%; box-sizing: border-box; padding: 8px 9px; font: inherit; font-size: 13px;
    color: #eef1f8; background: #0e0f18; border: 1px solid rgba(255,255,255,.12); border-radius: 8px; }
  input[type=range] { width: 100%; accent-color: #f4b74a; cursor: pointer; }
  button { padding: 8px 12px; font: inherit; font-size: 13px; color: #d7dae6; background: #1a1c2b;
    border: 1px solid rgba(255,255,255,.12); border-radius: 8px; cursor: pointer; white-space: nowrap;
    -webkit-tap-highlight-color: transparent; }
  button:hover { background: #23263a; }
  button:active { transform: translateY(1px); }
  button.primary { color: #06060c; font-weight: 700; border: 0;
    background: linear-gradient(180deg, #ffe8b0, #f4b74a); }
  button.wide { width: 100%; margin-top: 14px; }
  .err { position: fixed; inset: 0; display: none; place-items: center; text-align: center;
    color: #ff9a9a; padding: 40px; z-index: 10; }

  /* Phones / small screens: dock becomes a bottom sheet; drop the desktop hint. */
  @media (max-width: 700px), (pointer: coarse) {
    .topleft { top: 10px; left: 12px; }
    .topleft h1 { font-size: 10px; letter-spacing: .12em; }
    .viewing { font-size: 17px; margin-top: 5px; min-height: 22px; }
    .viewing small { font-size: 11px; }
    .hint { display: none; }
    .perf { top: 10px; right: 12px; min-width: 0; } /* hint is hidden here → reuse the corner */
    /* Bottom is the dock sheet on mobile → sit the button under the title instead. */
    .genfab { bottom: auto; top: 70px; left: 12px; padding: 8px 14px; font-size: 12px; }
    .dock { left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); width: auto; }
    .dock-body { max-height: 46vh; }
  }
</style>
</head>
<body>

<div class="hud topleft">

</div>

<!-- Primary action, deliberately OUTSIDE the collapsible Controls dock so a new

<div class="dock" id="dock">

      <select id="renderer" style="width:100%;box-sizing:border-box;padding:6px 8px;font:inherit;font-size:12px;color:#eef1f8;background:#0e0f18;border:1px solid rgba(255,255,255,.12);border-radius:6px">
        <option value="wasm">WebAssembly (CPU)</option>

<div class="err" id="err"></div>

<script type="module">
// Names must stay index-aligned with the Rust tables (solar's ROSTER / SUNS).
// The planets themselves are the `planet` crate's archetypes, rendered by the
// same shader its own demo uses; these are just their names, prettified.
const PLANET_NAMES = ["desert","barren","moon","iron","obsidian","lava","molten sea",
  "terran","ocean","archipelago","gaia","swamp","savanna","toxic","radioactive","fungal","chrome",
  "ice","tundra","alpine","crystal","storm shroud","gas giant","ice giant","storm giant","ringed giant"];
const SUN_NAMES = ["yellow dwarf","orange dwarf","red giant","white star","blue giant"];

const $ = id => document.getElementById(id);
// The adapter name comes from a graphics driver, so it goes through this before
// it ever reaches innerHTML.
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const canvas = $("stage");
const ctx = canvas.getContext("2d", { alpha: false });
ctx.imageSmoothingEnabled = false;
const off = document.createElement("canvas");
const octx = off.getContext("2d");

let wasm, sys = 0, bufPtr = 0, bufLen = 0, posPtr = 0, imgData;

// --- WebGL2 scene renderer --------------------------------------------------
// The same scene, drawn by the rasterizer instead of by a compositor. Three
// passes: one fullscreen triangle for the backdrop, the dashed orbit paths as
// point sprites, then one quad per body back-to-front with alpha blending —
// which is painter's algorithm, i.e. exactly what `blit` was doing by hand.
//
// Rust still owns the scene. `gl_bodies` hands over a draw list whose every
// number comes from the same expressions `draw_bodies_band` uses (`Planet::at`,
// `to_screen`, `dest_rect`, the detail caps, the sunward light), and each record
// carries that shader's uniform block; the GLSL travels inside solar.wasm. So
// the archetype tables, the orbital mechanics and the octave budgets are
// transported, not duplicated.
//
// What disappears here is everything the CPU path had to cache. No backdrop
// sprite, no star-tile memo, no quantized boil clock, no `visible_tile_rect` —
// and, crucially, no per-frame pixel plumbing: nothing is read back, so the
// ~32 MB/frame of copies the CPU path moves is simply gone.
const VS_FULL = `#version 300 es
void main() {
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

// A body's quad, straight from the destination rect the compositor computed.
const VS_QUAD = `#version 300 es
uniform vec4 u_rect;   // x0, y0, w, h in screen px, top-down
uniform vec2 u_view;
void main() {
  vec2 c = vec2(float(gl_VertexID & 1), float((gl_VertexID >> 1) & 1));
  vec2 p = u_rect.xy + c * u_rect.zw;
  gl_Position = vec4(p.x / u_view.x * 2.0 - 1.0, 1.0 - p.y / u_view.y * 2.0, 0.0, 1.0);
}`;

// One dot — an orbit sample or a background star. Both come up from Rust already
// in screen px with their colour, so Kepler's equation stays in
// `Planet::plane_point` and the star walk stays in `visit_stars`; neither is
// restated here, and one buffer holds both.
//
// The stars are points rather than a fragment-shader gather on purpose: gathering
// means every pixel testing nine cells per layer, which measured as HALF the GPU
// frame against roughly one hash per fifty pixels here.
const VS_POINT = `#version 300 es
layout(location = 0) in vec2 a_pos;   // pinned: the VAO enables attributes 0 and 1
layout(location = 1) in vec3 a_col;
uniform vec2 u_view;
uniform float u_size;
out vec3 v_col;
void main() {
  v_col = a_col;
  gl_PointSize = u_size;
  gl_Position = vec4(a_pos.x / u_view.x * 2.0 - 1.0, 1.0 - a_pos.y / u_view.y * 2.0, 0.0, 1.0);
}`;

// Additive, matching `paint_orbit` and `paint_stars`. Both clamp in the Rust —
// orbit dots at (90, 96, 120), stars at white — where a blend saturates at 1.0
// instead. That differs only where dots overlap on an already-bright pixel, and
// the navy ground is nowhere near either cap.
const FS_POINT = `#version 300 es
precision highp float;
in vec3 v_col;
out vec4 fragColor;
void main() { fragColor = vec4(v_col, 1.0); }`;

const glc = $("glstage");
let gl = null, renderer = "wasm";
let progBg, progStar, progPlanet, progOrbit, ptVBO, ptVAO;
let glBgPtr, glPtPtr, glBodyPtr, bgLen, bodyStride, bodyHeader, maxBodies;
let orbCap, starCap, ptStride, glFeat;
let gpu = null;                      // adapter description, once a context exists
let drawn = { bodies: 0, orbit: 0, stars: 0 };

// --- GPU timing -------------------------------------------------------------
// There is no WebGL API for GPU *utilization* or VRAM — browsers do not expose
// either. What there is, where the browser allows it, is
// `EXT_disjoint_timer_query_webgl2`: elapsed GPU nanoseconds around a set of
// draws. That plus the vsync slot is a real utilization figure, and it is the
// one number the CPU-side timer cannot give, because the draw calls return long
// before the GPU has finished them.
//
// Chrome exposes it; Firefox removed it and Safari never shipped it, so treat
// its absence as normal rather than an error.
//
// Results are read a few frames late, on purpose: asking for one the frame it
// was issued stalls the CPU until the GPU drains, which is the very thing this
// path exists to avoid. A ring of query objects keeps that pipelined.
let tqExt = null, tqFree = [], tqBusy = [], emaGpu = 0, gpuSeen = false;
let tqDrops = 0, tqPolls = 0;
const TQ_MAX = 4;

/// Is the GPU timer telling the truth?
///
/// A frame cannot spend more GPU time than the wall clock between frames, give
/// or take a little pipelining — so a reading far past the observed interval is
/// the driver's timer misbehaving, not a slow GPU. SwiftShader here reports
/// ~750 ms against 50 ms frames, which is how this check came to exist.
///
/// It matters for more than the display: auto-detail paces off this number, and
/// an inflated one would slam the detail cap to the floor and stay there.
function gpuTimeTrustworthy() {
  if (!gpuSeen) return false;
  const iv = 1000 / Math.max(emaFps, 1);
  return emaGpu <= iv * 1.5 + 2.0;
}

function tqBegin() {
  if (!tqExt || tqBusy.length >= TQ_MAX) return null;
  const q = tqFree.pop() || gl.createQuery();
  gl.beginQuery(tqExt.TIME_ELAPSED_EXT, q);
  return q;
}

function tqEnd(q) {
  if (!q) return;
  gl.endQuery(tqExt.TIME_ELAPSED_EXT);
  tqBusy.push(q);
}

function tqPoll() {
  if (!tqExt || !tqBusy.length) return;
  const q = tqBusy[0];
  if (!gl.getQueryParameter(q, gl.QUERY_RESULT_AVAILABLE)) return;
  tqBusy.shift();
  tqPolls++;
  // A "disjoint" means the GPU was interrupted mid-query — a clock change, a
  // context switch, a mode set. The elapsed time is then meaningless, so drop
  // it rather than average garbage in. A driver that reports disjoint on EVERY
  // query (some software rasterizers do) never yields a number, so the count is
  // kept and the HUD says so rather than showing "waiting" for ever.
  if (gl.getParameter(tqExt.GPU_DISJOINT_EXT)) {
    tqDrops++;
  } else {
    const ms = gl.getQueryParameter(q, gl.QUERY_RESULT) / 1e6;
    emaGpu = gpuSeen ? emaGpu + (ms - emaGpu) * 0.1 : ms;
    gpuSeen = true;
  }
  tqFree.push(q);
}

function glCompile(type, src, what) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
    throw new Error(`${what}: ${gl.getShaderInfoLog(sh)}`);
  }
  return sh;
}

function glLink(vs, fs, what, unis) {
  const p = gl.createProgram();
  gl.attachShader(p, glCompile(gl.VERTEX_SHADER, vs, `${what} vertex`));
  gl.attachShader(p, glCompile(gl.FRAGMENT_SHADER, fs, `${what} fragment`));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(`${what} link: ${gl.getProgramInfoLog(p)}`);
  p.loc = {};
  for (const u of unis) p.loc[u] = gl.getUniformLocation(p, u);
  return p;
}

/// Read GLSL source `i` out of wasm memory. A complete fragment shader is the
/// two preludes (noise + dither, index 0 and 1) followed by one body.
function glSrc(i) {
  return new TextDecoder().decode(
    new Uint8Array(wasm.memory.buffer, wasm.gl_src_ptr(i), wasm.gl_src_len(i)));
}

/// What the WebGL2 context is actually running on.
///
/// `gl.RENDERER` is masked to something generic ("WebKit WebGL") by every modern
/// browser, so the real name needs `WEBGL_debug_renderer_info` — which Firefox
/// withholds under `privacy.resistFingerprinting` and some Safari versions do
/// not ship. Hence the fallback chain and the "hidden" wording rather than a
/// promise.
///
/// The `soft` flag is the fact worth surfacing: SwiftShader, llvmpipe and
/// friends are CPU rasterizers, so a browser that has quietly fallen back to one
/// is running this path with none of its advantages, and a slow frame there says
/// nothing about the shaders.
function describeGPU(gl) {
  const dbg = gl.getExtension("WEBGL_debug_renderer_info");
  const get = p => { try { return gl.getParameter(p); } catch { return null; } };
  const name = (dbg && get(dbg.UNMASKED_RENDERER_WEBGL)) || get(gl.RENDERER) || "unknown";
  const vendor = (dbg && get(dbg.UNMASKED_VENDOR_WEBGL)) || get(gl.VENDOR) || "";
  return {
    name: String(name),
    vendor: String(vendor),
    soft: /swiftshader|llvmpipe|softpipe|software|basic render|microsoft basic/i.test(`${name} ${vendor}`),
    masked: !dbg,
  };
}

function glInit() {
  if (gl) return gl;
  gl = glc.getContext("webgl2", {
    alpha: false, antialias: false, depth: false, stencil: false,
    premultipliedAlpha: false, preserveDrawingBuffer: true, desynchronized: true,
  });
  if (!gl) return null;
  const pre = glSrc(0) + glSrc(1);
  progBg = glLink(VS_FULL, pre + glSrc(2), "backdrop", ["B", "u_vh"]);
  progStar = glLink(VS_QUAD, pre + glSrc(3), "star", ["S", "u_size", "u_vh", "u_rect", "u_view"]);
  progPlanet = glLink(VS_QUAD, pre + glSrc(4), "planet",
    ["U", "u_seed", "u_feat", "u_size", "u_vh", "u_palette", "u_rect", "u_view"]);
  progOrbit = glLink(VS_POINT, FS_POINT, "orbit", ["u_view", "u_size"]);

  bgLen = wasm.gl_backdrop_len();
  bodyStride = wasm.gl_body_stride();
  bodyHeader = wasm.gl_body_header();
  maxBodies = wasm.gl_max_bodies();
  ptStride = wasm.gl_point_stride();
  // Orbits: the planet cap x `paint_orbit`'s steps. Stars: generous enough for a
  // big viewport at high density — `gl_star_points` truncates rather than
  // overruns, and reports the count back. Both live in one buffer, back to back.
  orbCap = 16 * 220;
  starCap = 24000;
  glBgPtr = wasm.alloc(bgLen * 4);
  glPtPtr = wasm.alloc((orbCap + starCap) * ptStride * 4);
  glBodyPtr = wasm.alloc(maxBodies * bodyStride * 4);

  glFeat = wasm.gl_feat();
  gpu = describeGPU(gl);
  tqExt = gl.getExtension("EXT_disjoint_timer_query_webgl2");
  ptVAO = gl.createVertexArray();
  ptVBO = gl.createBuffer();
  gl.bindVertexArray(ptVAO);
  gl.bindBuffer(gl.ARRAY_BUFFER, ptVBO);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, ptStride * 4, 0);
  gl.enableVertexAttribArray(1);
  gl.vertexAttribPointer(1, 3, gl.FLOAT, false, ptStride * 4, 8);
  gl.bindVertexArray(null);
  return gl;
}

/// One GPU frame. `finish()` before returning, so the caller's clock measures
/// the draw rather than the time it took to queue it.
function renderGLScene(w, h, cam, zoomArg, bgPanX, bgPanY, tOrbit, tSpin, tSun) {
  // The drawing buffer is the RENDER resolution; CSS stretches it to the display
  // as crisp square pixels, which is what the 2D path was using drawImage for.
  if (glc.width !== w || glc.height !== h) { glc.width = w; glc.height = h; }
  const tq = tqBegin();
  gl.viewport(0, 0, w, h);
  gl.disable(gl.BLEND);

  // 1 — backdrop. On the CPU this is full-frame serial work, re-painted every
  // frame whenever the camera follows a body (which invalidates the bg cache
  // key). Here it is one triangle.
  wasm.gl_backdrop(sys, glBgPtr, cam.x, cam.y, zoomArg, bgPanX, bgPanY);
  gl.useProgram(progBg);
  gl.uniform1fv(progBg.loc.B, new Float32Array(wasm.memory.buffer, glBgPtr, bgLen));
  gl.uniform1i(progBg.loc.u_vh, h);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // 2 — the dashed orbit paths and the parallax stars, as point sprites over an
  // additive blend. Both come from Rust in one buffer, back to back, and differ
  // only in point size, so it is one upload and two draw calls.
  const nOrb = wasm.gl_orbit_points(sys, glPtPtr, orbCap, w, h, cam.x, cam.y, zoomArg);
  const starPtr = glPtPtr + nOrb * ptStride * 4;
  const nStar = wasm.gl_star_points(sys, starPtr, starCap, w, h, cam.x, cam.y, zoomArg, bgPanX, bgPanY);
  if (nOrb + nStar > 0) {
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);
    gl.bindVertexArray(ptVAO);
    gl.bindBuffer(gl.ARRAY_BUFFER, ptVBO);
    gl.bufferData(gl.ARRAY_BUFFER,
      new Float32Array(wasm.memory.buffer, glPtPtr, (nOrb + nStar) * ptStride), gl.DYNAMIC_DRAW);
    gl.useProgram(progOrbit);
    gl.uniform2f(progOrbit.loc.u_view, w, h);
    if (nOrb > 0) {
      gl.uniform1f(progOrbit.loc.u_size, wasm.gl_orbit_width(sys));
      gl.drawArrays(gl.POINTS, 0, nOrb);
    }
    if (nStar > 0) {
      gl.uniform1f(progOrbit.loc.u_size, 1.0);   // a star is one pixel
      gl.drawArrays(gl.POINTS, nOrb, nStar);
    }
    gl.bindVertexArray(null);
  }

  // 3 — the bodies, back to front. Alpha over is the painter's algorithm `blit`
  // implemented by hand, so the depth sort reads the same.
  const n = wasm.gl_bodies(sys, glBodyPtr, w, h, cam.x, cam.y, zoomArg, tOrbit, tSpin, tSun);
  if (n > 0) {
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    const recs = new Float32Array(wasm.memory.buffer, glBodyPtr, n * bodyStride);
    for (let i = 0; i < n; i++) {
      const r = i * bodyStride;
      const isStar = recs[r] === 0;
      const p = isStar ? progStar : progPlanet;
      const uni = recs.subarray(r + bodyHeader, r + bodyStride);
      gl.useProgram(p);
      gl.uniform4f(p.loc.u_rect, recs[r + 1], recs[r + 2], recs[r + 3], recs[r + 3]);
      gl.uniform2f(p.loc.u_view, w, h);
      gl.uniform1i(p.loc.u_size, recs[r + 4] | 0);
      gl.uniform1i(p.loc.u_vh, h);
      if (isStar) {
        gl.uniform1fv(p.loc.S, uni.subarray(0, 32));
      } else {
        gl.uniform1fv(p.loc.U, uni);
        // `u_seed` only feeds the hero framing's starfield, which a tile never
        // reaches — the body's own seed is already folded into `U`.
        gl.uniform1ui(p.loc.u_seed, 0);
        gl.uniform1ui(p.loc.u_feat, glFeat);
        gl.uniform1i(p.loc.u_palette, 0);
      }
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
  }
  drawn = { bodies: n, orbit: nOrb, stars: nStar };
  tqEnd(tq);
  tqPoll();   // reads a query from a few frames ago, so it never stalls
  // Deliberately no `finish()`. It would make the render timer below honest at
  // the cost of stalling the CPU on the GPU every frame, and the whole point of
  // this path is that the two run independently. The timer therefore reports
  // submission cost; the fps counter is what measures the GPU.
}

/// Grey out what the GPU path does not have.
function syncRendererUI() {
  const isGL = renderer === "gl";
  glc.style.display = isGL ? "block" : "none";
  // The GPU renders `F_ALL` — see `gl_feat` — so the CPU-only thinning switch
  // has nothing to do there.
  $("nlodctl").classList.toggle("dim", isGL);
  $("glnote").textContent = isGL
    ? "Whole scene on the GPU — no backdrop cache, no tile blits, and no copy back: this canvas IS the render target."
    : "";
}

// Two INDEPENDENT quantities:
//   • cam.zoom = MAGNIFICATION — display (CSS) px per world unit; wheel / pinch /
//     fit change it. Bigger = a closer camera: things look larger AND resolve
//     more detail.
//   • pix      = PIXEL SIZE — how many display px one rendered pixel spans (the
//     slider). The render buffer is sized so a rendered pixel is always ~`pix`
//     display px REGARDLESS of zoom, then upscaled crisply. So the on-screen
//     block size is constant at every zoom (a consistent pixel-art look), while
//     zooming in renders bodies at a higher resolution — zoom reveals detail
//     rather than magnifying fixed blocks. Per-body pixel sliders (planet / sun)
//     make those bodies chunkier still, on top of this.
let cam = { x: 0, y: 0, zoom: 1 };
let seed = 7, pix = 1;
// Three independent animation clocks so orbit / planet-spin / star-spin pace
// separately; each accumulates so changing a speed never makes motion jump.
let tOrbit = 0, tSpin = 0, tSun = 0;
let orbitSpeed = 1, planetRot = 1, starRot = 1;
let follow = -1;                        // planet index the camera tracks, or -1
let planetKinds = [], sunKind = 0, nPlanets = 0;
let last = performance.now();
let curW = 0, curH = 0, curZoom = 1;    // last frame's render dims + render-px/world
// Background scroll = accumulated SCREEN-space camera pan (Δcam·zoom summed), so
// the star parallax rate is the same at every zoom and pure zoom moves nothing.
let bgPanX = 0, bgPanY = 0, camPrevX = 0, camPrevY = 0, bgResync = true;

// Perf readout: exponentially-smoothed FPS / WASM-render ms / whole-frame ms,
// plus a signal for whether the cached backdrop was reused this frame. DOM text
// is refreshed a few times a second; the EMAs update every frame.
let emaFps = 60, emaRender = 0, emaFrame = 0;
let perfPrev = performance.now(), perfDrawn = 0, bgSig = "", bgRedrewInWindow = false;

// Manual overrides applied to the System without regenerating it (spacing,
// sizes, per-body pixelation, per-body detail caps), plus the planet count
// (structural — needs a rebuild). countAuto keeps the seed-derived count until
// the user sets one.
let vSpacing = 1, vPsize = 1, vSsize = 1, vPpix = 1, vSpix = 1, vPdetail = 160, vSdetail = 110, vStarDen = 0.5, vStarPar = 1;
// Adaptive detail. Body tile resolution is by far the steepest cost knob in the
// scene — measured, dropping the cap from 160 to 56 is a ~2x frame — and it
// degrades the way pixel art wants to, by getting chunkier rather than blurrier.
// The slider is the CEILING; this only ever walks below it, and walks back up
// the moment there's headroom. `budget` is render-only ms: the rest of the frame
// (putImageData, drawImage, compositing) needs the balance of the 16.7ms vsync
// slot, and missing it is what pins you to exactly 30 fps.
let autoDetail = true, effDetail = 160;
// Render budget in ms. The vsync slot is 16.7; putImageData of a full-size
// buffer plus the crisp drawImage upscale need the rest. Overshooting it is
// what pins the demo to exactly 30 fps rather than degrading gracefully.
const AUTO_BUDGET = 11, AUTO_FLOOR = 32;
let vOrbitW = 1; // dashed orbit-path line thickness in px
let vEcc = 1;    // eccentricity multiplier (0 = circular, 1 = as generated)
let planetCount = 6, countAuto = true;

// Per-frame pixel-budget cap (perf): a phone renders far fewer pixels than a
// desktop. The internal buffer is allocated once at this size and reused.
const coarse = window.matchMedia("(pointer: coarse)").matches;
const PIXEL_BUDGET = coarse ? 430_000 : 1_600_000;

// Match the canvas backing store to the display size; the crisp upscale from the
// (smaller) render buffer happens in drawImage with smoothing off.
function setupCanvas() {
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  canvas.style.width = window.innerWidth + "px"; canvas.style.height = window.innerHeight + "px";
  ctx.imageSmoothingEnabled = false; // reset whenever the backing store resizes
}

// Resolve this frame's render buffer. Its size follows `pix` (one rendered pixel
// ≈ `pix` display px) and is INDEPENDENT of zoom, so the on-screen block size is
// constant. `zoomArg` = render-px-per-world = w·zoom/cssW, which GROWS with zoom,
// so bodies are rendered at higher resolution as you zoom in (detail, not bigger
// blocks). The budget cap only makes it chunkier under load.
function computeRender() {
  const cssW = canvas.width, cssH = canvas.height;
  let w = Math.round(cssW / pix);
  let h = Math.round(cssH / pix);
  const bs = Math.min(1, Math.sqrt(PIXEL_BUDGET / (w * h)));
  w = Math.round(w * bs); h = Math.round(h * bs);
  // Clamp + quantize to 8px steps so the buffer is reallocated rarely.
  w = Math.max(16, w - (w % 8)); h = Math.max(12, h - (h % 8));
  return { w, h, zoomArg: w * cam.zoom / cssW };
}

function fitView() {
  const ext = wasm.system_extent(sys);
  // On-screen half-span = ext * zoom; fit it into ~90% of the viewport.
  const z = Math.min(0.45 * canvas.width / ext, 0.45 * canvas.height / (ext * 0.55));
  cam = { x: 0, y: 0, zoom: z };
  follow = -1;
  bgPanX = 0; bgPanY = 0; bgResync = true; // recenter + skip the jump next frame
}

// Push the live view multipliers + detail caps into the current system.
function applyView() {
  if (sys) wasm.system_set_view(sys, vSpacing, vPsize, vSsize, vPpix, vSpix, autoDetail ? effDetail : vPdetail, vSdetail, vStarDen, vStarPar);
}

// (Re)build the system for the current seed + planet count and re-apply the
// view multipliers. Does NOT touch the camera — callers decide whether to fit.
function buildSystem() {
  if (sys) wasm.system_free(sys);
  sys = wasm.system_new_params(seed, countAuto ? 0 : planetCount);
  nPlanets = wasm.planet_count(sys);
  sunKind = wasm.sun_kind_of(sys);
  planetKinds = [];
  for (let i = 0; i < nPlanets; i++) planetKinds.push(wasm.planet_kind_at(sys, i));
  if (countAuto) { planetCount = nPlanets; $("count").value = nPlanets; }
  $("countV").textContent = nPlanets;
  applyView();
  // A rebuild makes a fresh System (orbit width defaults to 1), so re-apply the
  // stored thickness — keeps the chosen look across seed/planet-count changes.
  if (sys) wasm.system_set_orbit_width(sys, vOrbitW);
  if (sys) wasm.system_set_eccentricity(sys, vEcc);
  if (sys) wasm.system_set_night_lod(sys, $("nlod").checked ? 1 : 0);
  $("sysinfo").textContent = `${SUN_NAMES[sunKind] ?? "star"} · ${nPlanets} planets · seed ${seed}`;
}

// A new seed: rebuild and re-frame the whole system.
function generate(s) {
  seed = s >>> 0;
  $("seed").value = seed;
  buildSystem();
  tOrbit = tSpin = tSun = 0;
  fitView();
}

function frame(now) {
  const frameStart = performance.now();
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  tOrbit += dt * orbitSpeed;
  tSpin  += dt * planetRot;
  tSun   += dt * starRot;

  // Camera follows a clicked planet as it sweeps around its orbit.
  if (follow >= 0 && follow < nPlanets) {
    wasm.planet_pos(sys, follow, tOrbit, posPtr);
    const p = new Float32Array(wasm.memory.buffer, posPtr, 2);
    cam.x = p[0]; cam.y = p[1];
  }

  // Accumulate the camera's SCREEN-space pan (Δcam·zoom) for the background.
  // A resync (after fit/generate/follow-start) skips one frame so a camera jump
  // doesn't lurch the stars; pure zoom adds nothing since Δcam is 0.
  if (bgResync) { camPrevX = cam.x; camPrevY = cam.y; bgResync = false; }
  bgPanX += (cam.x - camPrevX) * cam.zoom;
  bgPanY += (cam.y - camPrevY) * cam.zoom;
  camPrevX = cam.x; camPrevY = cam.y;

  const { w, h, zoomArg } = computeRender();
  if (w !== curW || h !== curH) {   // (re)size the render surfaces only on change
    curW = w; curH = h;
    off.width = w; off.height = h;
    imgData = octx.createImageData(w, h);
  }
  curZoom = zoomArg;
  // Does this frame reuse the cached backdrop? Mirror the Rust bg cache key: if
  // none of (size, camera, zoom, pan, bg view params) changed, only the bodies
  // re-render and the whole background is a memcpy.
  const sig = `${w},${h},${cam.x},${cam.y},${cam.zoom},${bgPanX},${bgPanY},${vStarDen},${vStarPar},${vSpacing}`;
  if (sig !== bgSig) bgRedrewInWindow = true;   // backdrop repainted this frame
  bgSig = sig;

  // Time the actual WASM procedural render — the CPU cost the profiling targets.
  const r0 = performance.now();
  if (renderer === "gl") {
    renderGLScene(w, h, cam, zoomArg, bgPanX, bgPanY, tOrbit, tSpin, tSun);
  } else {
    wasm.render_t(sys, bufPtr, w, h, cam.x, cam.y, zoomArg, bgPanX, bgPanY, tOrbit, tSpin, tSun);
    imgData.data.set(new Uint8Array(wasm.memory.buffer, bufPtr, w * h * 4));
  }
  const renderMs = performance.now() - r0;
  // Both paths end with the same crisp upscale onto the display canvas, so the
  // timer above is the render and nothing else. The GPU path has nothing to put
  // back: it drew straight into `glc`.
  if (renderer === "gl") {
    // Already on screen — the GL canvas IS the display surface. Nothing to copy.
  } else {
    octx.putImageData(imgData, 0, 0);
    ctx.drawImage(off, 0, 0, w, h, 0, 0, canvas.width, canvas.height);
  }

  // HUD: what's under the crosshair (viewport centre)?
  const near = follow >= 0 ? follow : wasm.nearest_center(sys, w, h, cam.x, cam.y, zoomArg, tOrbit);
  const v = $("viewing");
  const kind = near >= 0 ? (PLANET_NAMES[planetKinds[near]] ?? "planet") : (SUN_NAMES[sunKind] ?? "the star");
  v.firstChild.textContent = (follow >= 0 ? "◎ following " : "") + kind + " ";

  updatePerf(now, renderMs, performance.now() - frameStart);
  requestAnimationFrame(frame);
}

// Smooth the raw per-frame timings and surface them a few times a second.
const FRAME_BUDGET = 1000 / 60; // ms of CPU one 60 fps frame affords
function updatePerf(now, renderMs, frameMs) {
  const iv = now - perfPrev; perfPrev = now;
  if (iv > 0 && iv < 1000) emaFps += (1000 / iv - emaFps) * 0.1;
  emaRender += (renderMs - emaRender) * 0.1;
  emaFrame += (frameMs - emaFrame) * 0.1;
  if (now - perfDrawn < 220) return;            // throttle DOM writes to ~4.5/s
  perfDrawn = now;
  const load = emaRender / FRAME_BUDGET * 100;  // render CPU as % of a 60 fps budget
  const px = curW * curH;
  $("pfFps").textContent = emaFps.toFixed(0);
  $("pfRender").textContent = emaRender.toFixed(1);
  $("pfFrame").textContent = `frame ${emaFrame.toFixed(1)} ms`;
  $("pfRes").textContent = `${curW}×${curH} · ${(px / 1000).toFixed(0)}k px`;
  // Two of these read differently on the GPU. `render` there is SUBMISSION cost
  // — the draw finishes after the call returns — so reporting it as a share of a
  // CPU frame budget would flatter it; and there is no backdrop cache to hit,
  // because the fullscreen triangle replaced it.
  const isGL = renderer === "gl";
  const gpuTrust = isGL && gpuTimeTrustworthy();
  $("pfLoad").textContent = isGL
    ? `submit ${emaRender.toFixed(1)} ms (GPU runs async)`
    : `CPU ${load.toFixed(0)}% of 60 fps`;
  $("pfBg").textContent = isGL
    ? "backdrop: no cache needed"
    : (bgRedrewInWindow ? "backdrop redraw" : "backdrop cached ✓");
  if (isGL && gpu) {
    // The masked case is common and benign (Firefox with resistFingerprinting,
    // some Safari builds) — say "hidden" rather than pretending to know.
    const label = gpu.masked ? `${gpu.name} (name hidden)` : gpu.name;
    $("pfGpu").innerHTML = gpu.soft
      ? `<span class="warn">⚠ software rasterizer — ${esc(gpu.name)}</span>`
      : `GPU ${esc(label)}`;
    $("pfGpu").title = `${gpu.vendor} — ${gpu.name}`;
    $("pfDraw").textContent =
      `draw ${drawn.bodies} bodies · ${drawn.stars} stars · ${drawn.orbit} orbit`;
    // The real number, where the browser allows it: not how long the calls took
    // to issue, but how long the GPU spent on them.
    $("pfGpuMs").textContent = !tqExt
      ? "gpu time: not exposed by this browser"
      : gpuTimeTrustworthy()
        ? `gpu ${emaGpu.toFixed(2)} ms · ${(emaGpu / FRAME_BUDGET * 100).toFixed(0)}% of a 60 fps slot`
        : gpuSeen
          ? `gpu timer implausible (${emaGpu.toFixed(0)} ms vs a ${(1000 / Math.max(emaFps, 1)).toFixed(0)} ms frame)`
          : tqDrops > 8
            ? `gpu time: driver reports every query disjoint (${tqDrops} dropped)`
            : `gpu time: waiting…`;
  } else {
    $("pfGpu").textContent = "";
    $("pfDraw").textContent = "";
    $("pfGpuMs").textContent = "";
  }
  if (autoDetail && isGL) {
    // Never off the render timer here: submission cost says nothing about how
    // long the GPU took. With a timer query there is a real measurement to aim
    // at, and the same square-law step the CPU path uses applies; without one,
    // fall back to the FRAME INTERVAL with a dead band around the vsync slot, so
    // it does not sawtooth while comfortably hitting 60.
    const was = effDetail;
    if (gpuTrust && emaGpu > 0.01) {
      const ratio = AUTO_BUDGET / emaGpu;
      if (ratio < 0.9 || ratio > 1.35) {
        const target = effDetail * (1 + 0.7 * (Math.sqrt(ratio) - 1));
        effDetail = Math.max(AUTO_FLOOR, Math.min(vPdetail, Math.round(target / 8) * 8));
      }
    } else {
      const iv = 1000 / Math.max(emaFps, 1);
      if (iv > 19.0) effDetail = Math.max(AUTO_FLOOR, Math.round(effDetail * 0.85 / 8) * 8);
      else if (iv < 17.2) effDetail = Math.min(vPdetail, effDetail + 8);
    }
    if (effDetail !== was) applyView();
    $("pfAuto").textContent = `detail ${effDetail}${effDetail < vPdetail ? " (auto)" : ""}`;
  } else if (autoDetail && emaRender > 0.01) {
    const was = effDetail;
    // A tile costs ~r^2, so the cap that hits the budget is the current one
    // scaled by sqrt(budget / measured) — one step instead of a slow walk.
    // (Checked against the measured curve: cap 160 -> 53ms, 96 -> 20.5, 64 ->
    // 10.1, which is r^2 plus a small fixed overhead.) Damped to 70% of the
    // correction so the overhead term can't make it oscillate, and only acted
    // on outside a dead band, so a frame sitting near budget stays put.
    const ratio = AUTO_BUDGET / emaRender;
    if (ratio < 0.9 || ratio > 1.35) {
      const target = effDetail * (1 + 0.7 * (Math.sqrt(ratio) - 1));
      effDetail = Math.max(AUTO_FLOOR, Math.min(vPdetail, Math.round(target / 8) * 8));
    }
    if (effDetail !== was) applyView();
    $("pfAuto").textContent = `detail ${effDetail}${effDetail < vPdetail ? " (auto)" : ""}`;
  } else if (!autoDetail) {
    $("pfAuto").textContent = `detail ${vPdetail} (manual)`;
  }
  bgRedrewInWindow = false;                      // reset for the next window
  const bar = $("pfBar");
  bar.style.width = Math.min(100, load).toFixed(0) + "%";
  bar.style.background = load < 60 ? "#57d38c" : load < 100 ? "#f4b74a" : "#ef6a6a";
}

// ---- interaction: one finger / mouse drags to pan, two fingers pinch to
//      zoom + pan, a tap follows the body under it, the wheel zooms. Unified
//      over Pointer Events so mouse and touch share one code path. ----------
const clampZoom = z => Math.min(60, Math.max(0.04, z));
// Everything below works in CSS px; cam.zoom is CSS px per world unit, and the
// canvas backing store is 1:1 with CSS px, so a client-relative point maps to
// world directly — no render-resolution factor involved (that's the whole point:
// interaction and framing are independent of how pixelated the render is).
function localPt(e) { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
function toWorld(lx, ly) { return [cam.x + (lx - canvas.width / 2) / cam.zoom, cam.y + (ly - canvas.height / 2) / cam.zoom]; }

const pointers = new Map();     // active pointerId -> {x, y} in CSS px
let panLast = null;             // last pos for single-pointer drag
let pinch = null;               // {dist, zoom, wx, wy} captured at pinch start
let gestureMoved = false, gesturePinched = false, gestureCount = 0;

function startPinch() {
  const [a, b] = [...pointers.values()];
  pinch = {
    dist: Math.hypot(a.x - b.x, a.y - b.y) || 1, zoom: cam.zoom,
    mx0: (a.x + b.x) / 2, my0: (a.y + b.y) / 2, // client-px midpoint at start
    camx0: cam.x, camy0: cam.y,
  };
  gesturePinched = true; panLast = null; follow = -1;
}

canvas.addEventListener("pointerdown", e => {
  const first = pointers.size === 0;
  try { canvas.setPointerCapture(e.pointerId); } catch {}
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  canvas.classList.add("drag");
  if (first) { panLast = { x: e.clientX, y: e.clientY }; gestureMoved = false; gesturePinched = false; gestureCount = 1; }
  else gestureCount++;
  if (pointers.size === 2) startPinch();
});

canvas.addEventListener("pointermove", e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (pointers.size >= 2 && pinch) {                 // two-finger pinch: zoom + pan
    const [a, b] = [...pointers.values()];
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2; // client px
    const dist = Math.hypot(a.x - b.x, a.y - b.y) || 1;
    // Zoom about the camera CENTRE (the zoom itself never moves cam); a
    // two-finger drag pans by the midpoint movement.
    cam.zoom = clampZoom(pinch.zoom * dist / pinch.dist);
    cam.x = pinch.camx0 - (mx - pinch.mx0) / cam.zoom;
    cam.y = pinch.camy0 - (my - pinch.my0) / cam.zoom;
    gestureMoved = true;
    return;
  }

  if (panLast && pointers.size === 1) {              // one-finger / mouse drag: pan
    const dx = e.clientX - panLast.x, dy = e.clientY - panLast.y;
    panLast = { x: e.clientX, y: e.clientY };
    if (Math.abs(dx) + Math.abs(dy) > 6) gestureMoved = true;
    cam.x -= dx / cam.zoom; cam.y -= dy / cam.zoom;  // world units = CSS px / zoom
    follow = -1;                                     // grabbing the view releases follow
  }
});

function liftPointer(e) {
  try { canvas.releasePointerCapture(e.pointerId); } catch {}
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (pointers.size === 1) { const p = [...pointers.values()][0]; panLast = { x: p.x, y: p.y }; }
  if (pointers.size === 0) {
    canvas.classList.remove("drag");
    // A clean single tap (no drag, no pinch) follows the body under it. The
    // hit test reuses the last frame's render dims + density (curW/H/Zoom).
    if (!gestureMoved && !gesturePinched && gestureCount === 1) {
      const [lx, ly] = localPt(e);
      const [cx, cy] = toWorld(lx, ly);
      follow = wasm.nearest_center(sys, curW, curH, cx, cy, curZoom, tOrbit); // -1 = release
      if (follow >= 0) bgResync = true; // cam will jump to the planet next frame
    }
    panLast = null; gestureCount = 0;
  }
}
canvas.addEventListener("pointerup", liftPointer);
canvas.addEventListener("pointercancel", liftPointer);

canvas.addEventListener("wheel", e => {
  e.preventDefault();
  // Zoom about the camera CENTRE: only the zoom changes, cam stays put. This
  // keeps the whole scene (and the background parallax anchor) centred, so the
  // parallax doesn't lurch when the system is panned off-centre.
  cam.zoom = clampZoom(cam.zoom * Math.exp(-e.deltaY * 0.0015));
}, { passive: false });

// ---- controls --------------------------------------------------------------
$("dockHead").addEventListener("click", () => $("dock").classList.toggle("collapsed"));

// Perf readout: click to collapse to the one-line summary; press P to hide it.
$("perf").addEventListener("click", () => $("perf").classList.toggle("min"));
window.addEventListener("keydown", e => {
  if ((e.key === "p" || e.key === "P") && e.target.tagName !== "INPUT") $("perf").classList.toggle("off");
});

// Generate makes a NEW random system each click; the dice does the same. Type a
// number in the seed field to load a specific system instead.
$("gen").addEventListener("click", () => generate((Math.random() * 0xffffff) >>> 0));
$("dice").addEventListener("click", () => generate((Math.random() * 0xffffff) >>> 0));
$("seed").addEventListener("change", () => generate((parseInt($("seed").value) || 0)));
$("fit").addEventListener("click", fitView);

// Planet count is structural → rebuild (keep the camera). Once set, it sticks
// across new seeds (countAuto stays off).
$("count").addEventListener("input", () => {
  planetCount = parseInt($("count").value) || 1; countAuto = false;
  $("countV").textContent = planetCount; buildSystem();
});

// Live view multipliers: rescale the existing system, no rebuild, no re-frame.
const liveMul = (id, valId, set, fmt) => $(id).addEventListener("input", () => {
  const v = parseFloat($(id).value); set(v); $(valId).textContent = fmt(v); applyView();
});
liveMul("spacing", "spacingV", v => vSpacing = v, v => v.toFixed(2) + "×");
liveMul("psize", "psizeV", v => vPsize = v, v => v.toFixed(2) + "×");
liveMul("ssize", "ssizeV", v => vSsize = v, v => v.toFixed(2) + "×");
liveMul("ppix", "ppixV", v => vPpix = v, v => v + "×");
liveMul("spix", "spixV", v => vSpix = v, v => v + "×");

// Orbit-path line thickness: pushes straight to wasm (not a set_view param).
$("orbw").addEventListener("input", () => {
  vOrbitW = parseInt($("orbw").value) || 1;
  $("orbwV").textContent = vOrbitW + "px";
  if (sys) wasm.system_set_orbit_width(sys, vOrbitW);
});

// Eccentricity multiplier: 0 = circular, 1 = as generated, up to 2 = exaggerated.
$("ecc").addEventListener("input", () => {
  vEcc = parseFloat($("ecc").value);
  $("eccV").textContent = vEcc.toFixed(2) + "×";
  if (sys) wasm.system_set_eccentricity(sys, vEcc);
});

// WebGL2 is opt-in: probed on selection, not at load, so a machine without it
// never pays for a failed context.
$("renderer").addEventListener("change", async () => {
  const want = $("renderer").value;
  if (want === "gl") {
    try {
      if (!glInit()) throw new Error("this browser has no WebGL2 context");
    } catch (e) {
      $("renderer").value = "wasm";
      $("glnote").textContent = String(e.message || e);
      return;
    }
  }
  renderer = want;
  syncRendererUI();
});

// Past the terminator `shade` bottoms out at the ambient floor and ~3 of the 22
// output levels are reachable, so the fine octaves and the whole cloud deck are
// not computed there. 1.23x on a planet that fills the view; it costs detail on
// the dark limb, which is why it is opt-in rather than always on.
$("nlod").addEventListener("change", () => {
  const on = $("nlod").checked;
  $("nlodV").textContent = on ? "on" : "off";
  if (sys) wasm.system_set_night_lod(sys, on ? 1 : 0);
});

$("auto").addEventListener("change", () => {
  autoDetail = $("auto").checked;
  $("autoV").textContent = autoDetail ? "on" : "off";
  effDetail = vPdetail;            // hand control back at the slider's value
  applyView();
});

// Purely JS-side: animation rate and scene render density.
$("speed").addEventListener("input", () => { orbitSpeed = parseFloat($("speed").value); $("speedV").textContent = orbitSpeed.toFixed(1) + "×"; });
$("prot").addEventListener("input", () => { planetRot = parseFloat($("prot").value); $("protV").textContent = planetRot.toFixed(1) + "×"; });
$("srot").addEventListener("input", () => { starRot = parseFloat($("srot").value); $("srotV").textContent = starRot.toFixed(1) + "×"; });
$("pix").addEventListener("input", () => { pix = parseInt($("pix").value) || 1; $("pixV").textContent = pix + "×"; });
// Detail caps (the "lower bound of pixelation"): live view params, no rebuild.
liveMul("pdet", "pdetV", v => { vPdetail = v; effDetail = Math.min(effDetail, v); }, v => String(v | 0));
liveMul("sdet", "sdetV", v => vSdetail = v, v => String(v | 0));
liveMul("sden", "sdenV", v => vStarDen = v, v => v.toFixed(2) + "×");
liveMul("spar", "sparV", v => vStarPar = v, v => v.toFixed(2) + "×");
window.addEventListener("resize", setupCanvas);

async function main() {
  const res = await fetch("./solar.wasm?v=" + Date.now(), { cache: "no-store" });
  const { instance } = await WebAssembly.instantiate(await res.arrayBuffer(), {});
  wasm = instance.exports;
  posPtr = wasm.alloc(2 * 4);              // scratch for planet_pos
  // Sized to the budget once (+ margin to absorb rounding in computeRender, so
  // w*h*4 can never exceed this and the WASM render stays in bounds).
  bufLen = (PIXEL_BUDGET + 16384) * 4;
  bufPtr = wasm.alloc(bufLen);
  setupCanvas();
  generate(7);
  syncRendererUI();
  requestAnimationFrame(frame);
}
main().catch(e => { $("err").style.display = "grid"; $("err").textContent = "failed to load solar.wasm — " + e; console.error(e); });
</script>
</body>
</html>
