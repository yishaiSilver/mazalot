[package]
name = "solar"
version = "0.1.0"
edition = "2021"

# Same three-face shape as `planet` and `star`:
#   • lib.rs   — pure system-render math (rlib for the bin, cdylib for wasm)
#   • wasm.rs  — a thin C-ABI wrapper over the lib, compiled only for wasm32
#   • bin/*    — native GIF/PNG generator (needs `image`, the `native` feature)
# Shares its noise/color primitives and its star + planet renderers with the
# sibling crates via the dependency-free `noise-core`/`dither-core`/`scene-core`/
# `sun-core`/`planet-core` rlibs (they used to be copy-pasted in here). The planets
# in orbit here are the *same* worlds the `planet` demo renders — `planet-core`
# owns the archetype table and the shader; this crate only frames them in a scene.
# Because those shared crates carry no third-party deps, the wasm build
# (`--no-default-features`) stays tiny.

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
# Shared, dependency-free primitive rlibs. Plain (non-optional) deps so they're
# present in the wasm build too — the pure render path stays tiny.
noise-core = { path = "../noise-core" }
# Only for its GLSL prelude, which the GPU path concatenates in front of every
# fragment shader. Pure data, so it costs the native build nothing.
dither-core = { path = "../dither-core" }
scene-core = { path = "../scene-core" }
# The shared deep-space backdrop (ground + nebula + parallax stars).
background-core = { path = "../background-core" }
sun-core = { path = "../sun-core" }
# The planet archetypes + shader, shared verbatim with the `planet` crate. Depend
# on the rlib, not on `planet` itself: `planet` is a cdylib whose `#[no_mangle]`
# C-ABI exports would collide with this crate's own in the wasm build.
planet-core = { path = "../planet-core" }
# Raw C-ABI glue for wasm.rs. Plain (non-optional) dep — it exports no C symbols
# itself, so the wasm export set is unchanged; used only under target_arch=wasm32.
wasm-abi = { path = "../wasm-abi" }
# Native image-crate orchestration (GIF/PNG). Optional: only the native bin pulls
# it, so the wasm build (`--no-default-features`) stays tiny.
render-io = { path = "../render-io", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The GPU path is a browser feature: switch on each core crate's `gl`
# module for the wasm build only, so the native generators keep the exact
# float codegen `out/` is pinned against.
planet-core = { path = "../planet-core", features = ["gl"] }
background-core = { path = "../background-core", features = ["gl"] }
sun-core = { path = "../sun-core", features = ["gl"] }

[dev-dependencies]
# ...and for `cargo test`, which runs natively but must still cover the
# frame packer. Resolver 2 keeps dev-dependency features out of
# `cargo build`, so this cannot reach the generators.
planet-core = { path = "../planet-core", features = ["gl"] }
background-core = { path = "../background-core", features = ["gl"] }
sun-core = { path = "../sun-core", features = ["gl"] }

[features]
default = ["native"]
native = ["dep:render-io"]

[[bin]]
name = "solar"
required-features = ["native"]

[[bin]]
name = "bench"
required-features = ["native"]
