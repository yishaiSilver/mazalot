[package]
name = "planet-core"
version = "0.1.0"
edition = "2021"

# The full-fidelity planet renderer: the type table, the per-pixel sphere shader
# (weather, aurora, specular, rings, moons) and the pixel-art quantizer. One
# shader, two framings:
#   • hero  — `render_rgba*`, a planet filling a square frame (the `planet` crate)
#   • scene — `render_tile`, a transparent sprite lit from any direction (`solar`)
# Depends only on the dependency-free `*-core` rlibs, so the wasm builds that pull
# it in stay tiny.

[lib]
crate-type = ["rlib"]

[dependencies]
noise-core = { path = "../noise-core" }
dither-core = { path = "../dither-core" }
# For the `Tile` sprite target a scene compositor blits.
scene-core = { path = "../scene-core" }

[features]
# The WebGL2 uniform block + GLSL. OFF by default, and that is load-bearing:
# compiling it changes nothing about what the CPU renderer computes, but merely
# adding another caller of the seeded helpers to this crate's LTO unit re-prices
# their inlining and moves `out/` by a few /255 (see CLAUDE.md). The native
# generators have no GPU, so they do not carry it; the wasm builds turn it on
# through a target-specific dependency.
gl = []
