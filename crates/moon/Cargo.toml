[package]
name = "moon"
version = "0.1.0"
edition = "2021"

# Same three-face shape as `solar` and `star`:
#   • lib.rs   — pure planet+moons render math (rlib for the bin, cdylib for wasm)
#   • wasm.rs  — a thin C-ABI wrapper over the lib, compiled only for wasm32
#   • bin/*    — native GIF/PNG generator (needs `image`, the `native` feature)
# Shares its noise/color primitives and its planet tile renderer with the sibling
# crates via the dependency-free `noise-core`/`dither-core`/`scene-core`/`planet-core`
# rlibs (they used to be copy-pasted in here). Because those shared crates carry no
# third-party deps, the wasm build (`--no-default-features`) stays tiny.

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
# Shared, dependency-free primitive rlibs. Plain (non-optional) deps: they must
# be present in the wasm build too, so they are NOT feature-gated.
noise-core = { path = "../noise-core" }
dither-core = { path = "../dither-core" }
scene-core = { path = "../scene-core" }
# The planet archetypes + shader, shared verbatim with `planet` and `solar`.
# Depend on the rlib, not on `planet` itself: `planet` is a cdylib whose
# `#[no_mangle]` C-ABI exports would collide with this crate's own in wasm.
planet-core = { path = "../planet-core" }
image = { version = "0.25", default-features = false, features = ["png", "gif"], optional = true }
# Shared C-ABI wasm glue (macros + tiny helpers). Plain dep: it's present in the
# wasm build too, and exports ZERO C symbols, so the wasm export set is unchanged.
wasm-abi = { path = "../wasm-abi" }
# Shared native `image`-crate orchestration (GIF/poster writers) for the bin.
render-io = { path = "../render-io", optional = true }

[features]
default = ["native"]
native = ["dep:image", "dep:render-io"]

[[bin]]
name = "moon"
required-features = ["native"]
