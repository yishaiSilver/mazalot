[package]
name = "comet"
version = "0.1.0"
edition = "2021"

# Same three-face shape as `planet`, `star` and `solar`:
#   • lib.rs   — pure comet/orbit-render math (rlib for the bin, cdylib for wasm)
#   • wasm.rs  — a thin C-ABI wrapper over the lib, compiled only for wasm32
#   • bin/*    — native GIF/PNG generator (needs `image`, the `native` feature)
# Shares its noise/color/dither primitives and its compact star tile renderer with
# the sibling crates via the dependency-free `noise-core`/`dither-core`/`scene-core`/
# `sun-core` rlibs (they used to be copy-pasted in here). Because those shared crates
# carry no third-party deps, the wasm build (`--no-default-features`) stays tiny.

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
# Shared, dependency-free primitive crates (present in the wasm build too).
noise-core = { path = "../noise-core" }
dither-core = { path = "../dither-core" }
scene-core = { path = "../scene-core" }
sun-core = { path = "../sun-core" }
# Raw C-ABI alloc/dealloc + opaque-handle glue for wasm.rs (exports no symbols
# itself, so the wasm export set is unchanged). Plain dep: also in the wasm build.
wasm-abi = { path = "../wasm-abi" }
# Native GIF/PNG orchestration for the bin; only via the `native` feature, so the
# wasm build never pulls it (or its `image` dep) in.
render-io = { path = "../render-io", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "gif"], optional = true }

[features]
default = ["native"]
native = ["dep:image", "dep:render-io"]

[[bin]]
name = "comet"
required-features = ["native"]
