[package]
name = "ship"
version = "0.1.0"
edition = "2021"

# Same three-face shape as `planet`, `star`, `solar`, `moon`, `asteroid` and
# `comet`:
#   • lib.rs   — pure spaceship generation + render math (rlib for the bin,
#                cdylib for wasm)
#   • wasm.rs  — a thin C-ABI wrapper over the lib, compiled only for wasm32
#   • bin/*    — native GIF/PNG generator (needs `image`, the `native` feature)
# Fully self-contained: carries its own noise/color/dither primitives and its own
# part rasterizer, so it shares no code with the other "type" crates — only
# third-party deps and the workspace manifest. The pure render path uses NO
# deps, so the wasm build (`--no-default-features`) stays tiny.

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "gif"], optional = true }

[features]
default = ["native"]
native = ["dep:image"]

[[bin]]
name = "ship"
required-features = ["native"]
