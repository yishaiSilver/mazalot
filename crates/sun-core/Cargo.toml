[package]
name = "sun-core"
version = "0.1.0"
edition = "2021"

# Compact "lite" star renderer shared across the scene crates.
# Dependency-free apart from the other *-core crates.

[lib]
crate-type = ["rlib"]

[dependencies]
noise-core = { path = "../noise-core" }
dither-core = { path = "../dither-core" }
scene-core = { path = "../scene-core" }

[features]
# The WebGL2 uniform block + GLSL. OFF by default, and that is load-bearing:
# compiling it changes nothing about what the CPU renderer computes, but merely
# adding another caller of the seeded helpers to this crate's LTO unit re-prices
# their inlining and moves `out/` by a few /255 (see CLAUDE.md). The native
# generators have no GPU, so they do not carry it; the wasm builds turn it on
# through a target-specific dependency.
gl = []
