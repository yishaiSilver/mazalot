[package]
name = "asteroid"
version = "0.1.0"
edition = "2021"

# Same three-face shape as `solar` and `star`:
#   • lib.rs   — pure belt-render math (rlib for the bin, cdylib for wasm)
#   • wasm.rs  — a thin C-ABI wrapper over the lib, compiled only for wasm32
#   • bin/*    — native GIF/PNG generator (needs `image`, the `native` feature)
# Shares its noise/color/dither primitives with the sibling crates via the
# dependency-free `noise-core`/`dither-core`/`scene-core` rlibs (they used to be
# copy-pasted in here). Because those shared crates carry no third-party deps, the
# wasm build (`--no-default-features`) stays tiny.

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
noise-core = { path = "../noise-core" }
dither-core = { path = "../dither-core" }
scene-core = { path = "../scene-core" }
image = { version = "0.25", default-features = false, features = ["png", "gif"], optional = true }
# Shared C-ABI glue (macros + tiny helpers). Plain, non-optional dep so it's
# present in the wasm build too; exports zero C symbols of its own.
wasm-abi = { path = "../wasm-abi" }
# Shared native `image`-crate orchestration for the bin (GIF/PNG writers).
render-io = { path = "../render-io", optional = true }

[features]
default = ["native"]
native = ["dep:image", "dep:render-io"]

[[bin]]
name = "asteroid"
required-features = ["native"]
