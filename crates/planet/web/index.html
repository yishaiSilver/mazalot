<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Procedural Planet — Rust · WASM</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; min-height: 100%;
    background: radial-gradient(circle at 50% 18%, #12131f 0%, #06060c 70%);
    color: #d7dae6;
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  .app { max-width: 880px; margin: 0 auto; padding: 28px 20px 48px;
         display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start; justify-content: center; }
  h1 { font-size: 14px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
       color: #7f86a3; margin: 0 0 14px; }
  .left { text-align: center; position: sticky; top: 20px; }
  .stage {
    width: 360px; height: 360px; max-width: 82vw; max-height: 82vw;
    border-radius: 14px; background: #05060b;
    box-shadow: 0 10px 40px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.05);
    display: block; image-rendering: pixelated;
  }
  .name { font-size: 20px; font-weight: 700; color: #eef1f8; text-transform: capitalize; margin-top: 16px; }
  .sub { font-size: 12px; color: #6b7290; letter-spacing: .04em; }
  .gen { margin-top: 14px; padding: 11px 22px; font: inherit; font-weight: 600;
    color: #06060c; background: linear-gradient(180deg, #eef1f8, #c7cde0);
    border: 0; border-radius: 999px; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
  .gen:active { transform: translateY(1px); }

  .panel { width: 340px; background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.06);
           border-radius: 14px; padding: 16px 18px 20px; }
  .panel h2 { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #7f86a3; margin: 0 0 12px; }
  .grp { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: #565d78;
         margin: 16px 0 8px; border-top: 1px solid rgba(255,255,255,.06); padding-top: 12px; }
  .ctl { margin: 0 0 11px; }
  .ctl label { display: flex; justify-content: space-between; font-size: 12px; color: #9aa0bb; margin-bottom: 4px; }
  .ctl label b { color: #eef1f8; font-variant-numeric: tabular-nums; font-weight: 600; }
  input[type=range] { width: 100%; accent-color: #8fb7ff; cursor: pointer; }
  select, input[type=number] { width: 100%; box-sizing: border-box; padding: 8px 10px; font: inherit; font-size: 13px;
    color: #eef1f8; background: #0e0f18; border: 1px solid rgba(255,255,255,.1); border-radius: 8px; }
  .rowflex { display: flex; gap: 8px; } .rowflex input { flex: 1; }
  .mini { padding: 8px 12px; font: inherit; color: #d7dae6; background: #171826;
    border: 1px solid rgba(255,255,255,.1); border-radius: 8px; cursor: pointer; }
  .mini:active { transform: translateY(1px); }
  .reset { width: 100%; margin-top: 12px; }
  .foot { width: 100%; text-align: center; font-size: 11px; color: #4d536b; letter-spacing: .05em; }
  .foot code { color: #6b7290; }
  .stage-wrap { position: relative; display: inline-block; }
  .crt { position: absolute; inset: 0; border-radius: 14px; pointer-events: none; opacity: 0;
    transition: opacity .2s; mix-blend-mode: multiply;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.32) 0, rgba(0,0,0,.32) 1px, transparent 2px, transparent 3px),
      radial-gradient(circle at 50% 50%, transparent 55%, rgba(0,0,0,.5) 100%); }
  .crt.on { opacity: 1; }
  .chk { justify-content: flex-start !important; gap: 8px; cursor: pointer; color: #cfd4e6 !important; }
  .chk input { accent-color: #8fb7ff; }

  /* Feature cost lab */
  .lab { margin-top: 14px; }
  .feats { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; margin-bottom: 10px; }
  .feats label { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: #9aa0bb; cursor: pointer; }
  .feats input { accent-color: #f4b74a; cursor: pointer; }
  .feats label.opt { color: #7f86a3; font-style: italic; }
  .labhead { display: flex; justify-content: space-between; align-items: baseline; }
  .live { font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: #9aa0bb;
          font-variant-numeric: tabular-nums; }
  .live b { color: #eef1f8; }
  table.costs { width: 100%; border-collapse: collapse; margin-top: 10px;
                font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
                font-variant-numeric: tabular-nums; }
  table.costs th { text-align: right; font-weight: 600; color: #565d78; font-size: 10px;
                   letter-spacing: .08em; text-transform: uppercase; padding-bottom: 4px; }
  table.costs th:first-child, table.costs td:first-child { text-align: left; }
  table.costs td { text-align: right; padding: 2px 0; color: #9aa0bb; border-top: 1px solid rgba(255,255,255,.05); }
  table.costs td.n { color: #eef1f8; }
  table.costs tr.opt td { color: #57d38c; }
  table.costs .barw { width: 34%; padding-left: 8px; }
  table.costs .barw i { display: block; height: 6px; border-radius: 2px 3px 3px 2px; background: #f4b74a; }
  table.costs tr.opt .barw i { background: #57d38c; }
</style>
</head>
<body>
<div class="app">
  <div class="left">
    <h1>Procedural Planet</h1>
    <div class="stage-wrap">
      <canvas class="stage" id="stage" width="360" height="360"></canvas>
      <div class="crt" id="crtfx"></div>
    </div>
    <div class="name" id="name">loading…</div>
    <div class="sub" id="sub">Rust → WebAssembly · live sphere shading</div>
    <button class="gen" id="gen">✦ Generate random</button>
  </div>

  <div class="panel">
    <h2>Controls</h2>
    <div class="ctl"><label>Type</label><select id="type"></select></div>
    <div class="ctl"><label>Seed</label>
      <div class="rowflex"><input type="number" id="seed" min="0" value="1" /><button class="mini" id="rndseed" title="random seed">🎲</button></div>
    </div>
    <div class="ctl"><label>Resolution <b id="resV">64</b></label><input type="range" id="res" min="40" max="240" step="8" value="64" /></div>
    <div class="ctl"><label>Spin speed <b id="spnV">0.012</b></label><input type="range" id="spn" min="0" max="0.05" step="0.002" value="0.012" /></div>

    <div class="grp">Look</div>
    <div class="ctl"><label>Palette</label>
      <select id="palette">
        <option value="0">Natural</option>
        <option value="1">Game Boy</option>
        <option value="2">Ice duotone</option>
        <option value="3">Sunset</option>
      </select>
    </div>
    <div class="ctl"><label>Dither <b id="dthV">0.70</b></label><input type="range" id="dth" min="0" max="1" step="0.05" value="0.7" /></div>
    <div class="ctl"><label class="chk"><input type="checkbox" id="moons" checked /> Orbiting moons</label></div>
    <div class="ctl"><label class="chk"><input type="checkbox" id="crt" /> CRT / scanlines</label></div>

    <div id="sliders"></div>

    <button class="mini reset" id="reset">↺ reset params to type defaults</button>

    <div class="grp">Feature cost lab</div>
    <div class="lab">
      <div class="labhead">
        <span style="font-size:11px;color:#7f86a3">untick to switch off</span>
        <span class="live"><b id="labMs">–</b> ms · <b id="labFps">–</b> fps</span>
      </div>
      <div class="feats" id="feats"></div>
      <button class="mini" id="measure" style="width:100%">⏱ measure what each feature costs</button>
      <div id="costs"></div>
    </div>
  </div>

  <div class="foot">rendered live in <code>planet.wasm</code> — same code as the native generator</div>
</div>

<script type="module">
const NAMES = [
  "terran","ocean","archipelago","desert","swamp","iron","ice","barren",
  "gas giant","ice giant","lava","fungal","savanna","gaia","tundra","alpine",
  "obsidian","chrome","moon","storm giant","ringed giant","molten sea",
  "radioactive","crystal","toxic","storm shroud",
];

// Slider defs in DISPLAY order; `pi` = parameter index into the wasm params array
// (MUST match planet::param). `g` starts a new group header.
const PARAMS = [
  { g:"Terrain", pi:0,  label:"Contrast",      min:0.6, max:3.2, step:0.05, fix:2 },
  {             pi:1,  label:"Frequency",     min:1,   max:6,   step:0.1,  fix:1 },
  {             pi:5,  label:"Ice caps",      min:0,   max:1,   step:0.02, fix:2 },
  { g:"Surface", pi:2,  label:"Specular glare",min:0,   max:1,   step:0.02, fix:2 },
  {             pi:3,  label:"Shininess",     min:2,   max:40,  step:1,    fix:0 },
  {             pi:12, label:"Glare ↔ albedo",min:0,   max:1,   step:0.05, fix:2 },
  { g:"Weather", pi:4,  label:"Clouds",        min:0,   max:1,   step:0.02, fix:2 },
  {             pi:9,  label:"Storm cells",   min:0,   max:1,   step:0.02, fix:2 },
  {             pi:8,  label:"Aurora",        min:0,   max:1.5, step:0.02, fix:2 },
  {             pi:7,  label:"Lightning",     min:0,   max:1.5, step:0.02, fix:2 },
  {             pi:6,  label:"Great spot",    min:0,   max:1.5, step:0.02, fix:2 },
  { g:"Gas giant bands", pi:10, label:"Bands", min:3,  max:14,  step:0.5,  fix:1 },
  {             pi:11, label:"Turbulence",    min:0,   max:1.5, step:0.02, fix:2 },
];

// Everything that can be switched off, and how. `pi` zeroes a shader parameter
// (the type's own sliders already gate these on > 0); `bit` clears a flag the
// wasm reads; `add` sets one the wasm does not have on by default; `style`
// drives the existing look controls. `opt: true` marks the entries that are
// OPTIMIZATIONS rather than features — unticking those makes the frame slower,
// and the table reports them as a saving.
const FEATURES = [
  { key: "clouds",   label: "Cloud layer",        pi: 4 },
  { key: "shadow",   label: "└ cloud shadow",     bit: 1 },
  { key: "storm",    label: "└ storm-cell swirl", pi: 9 },
  { key: "aurora",   label: "Aurora",             pi: 8 },
  { key: "specular", label: "Specular + shimmer", pi: 2 },
  { key: "spot",     label: "Great spot",         pi: 6 },
  { key: "lightning",label: "Lightning",          pi: 7 },
  { key: "caps",     label: "Ice caps",           pi: 5 },
  { key: "atmo",     label: "Atmosphere rim",     bit: 2 },
  { key: "rim",      label: "Dark limb rim",      bit: 4 },
  { key: "stars",    label: "Starfield",          bit: 8 },
  { key: "moons",    label: "Orbiting moons",     style: "moons" },
  { key: "dither",   label: "Ordered dither",     style: "dither" },
  { key: "night",    label: "Night-side thinning", bit: 16, opt: true },
  { key: "warp",     label: "Cheap warp inner",    bit: 32, opt: true },
  { key: "frozen",   label: "Frozen cloud deck",   add: 64, opt: true },
  { key: "baksurf",  label: "Baked surface",       add: 128, opt: true },
  { key: "bakband",  label: "Baked bands",         add: 256, opt: true },
  { key: "morphlut", label: "└ billow (morph LUT)",  add: 512 },
];
const on = new Set(FEATURES.map(f => f.key));   // everything on to begin with
let FEAT_ALL = 63;

const $ = id => document.getElementById(id);
const stage = $("stage");
const sctx = stage.getContext("2d");
sctx.imageSmoothingEnabled = false;
const off = document.createElement("canvas");
const octx = off.getContext("2d");

let wasm, bufPtr, bufLen, imgData, paramsPtr, NUM;
let NATIVE = 64, typeIdx = 0, seed = 1, angle = 0, spin = 0.012;
const sliders = {}; // pi -> { input, val }

function buildSliders() {
  const host = $("sliders");
  for (const p of PARAMS) {
    if (p.g) { const h = document.createElement("div"); h.className = "grp"; h.textContent = p.g; host.appendChild(h); }
    const wrap = document.createElement("div"); wrap.className = "ctl";
    const lab = document.createElement("label");
    const val = document.createElement("b");
    lab.textContent = p.label + " "; lab.appendChild(val);
    const inp = document.createElement("input");
    inp.type = "range"; inp.min = p.min; inp.max = p.max; inp.step = p.step;
    inp.addEventListener("input", () => val.textContent = parseFloat(inp.value).toFixed(p.fix));
    wrap.appendChild(lab); wrap.appendChild(inp); host.appendChild(wrap);
    sliders[p.pi] = { input: inp, val, fix: p.fix };
  }
}

function setResolution(n) {
  NATIVE = n; off.width = off.height = n; imgData = octx.createImageData(n, n);
  if (bufPtr) wasm.dealloc(bufPtr, bufLen);
  bufLen = n * n * 4; bufPtr = wasm.alloc(bufLen); $("resV").textContent = n;
}

function loadTypeDefaults(t) {
  for (const p of PARAMS) {
    const v = wasm.param(t, p.pi);
    sliders[p.pi].input.value = v;
    sliders[p.pi].val.textContent = v.toFixed(p.fix);
  }
}

function setType(t) {
  typeIdx = t; $("type").value = String(t);
  $("name").textContent = NAMES[t] ?? `type ${t}`;
  $("sub").textContent = `seed ${seed} · type ${t}`;
  loadTypeDefaults(t);
}

function randomize() {
  seed = (Math.random() * 0xffffff) >>> 0; $("seed").value = seed;
  setType(Math.floor(Math.random() * NAMES.length));
}

// Write the params for a given feature set into wasm memory and return the
// non-param arguments that go with it. One place, so the live frame and the
// measurement can never disagree about what "off" means.
function applyFeatures(set) {
  const pv = new Float32Array(wasm.memory.buffer, paramsPtr, NUM);
  for (const p of PARAMS) pv[p.pi] = parseFloat(sliders[p.pi].input.value);
  let feat = FEAT_ALL;
  let moons = $("moons").checked ? 1 : 0;
  let dither = parseFloat($("dth").value);
  for (const f of FEATURES) {
    if (set.has(f.key)) {
      // `add` is the mirror of `bit`: a switch the renderer does NOT have on by
      // default, so ticking it ORs the bit in rather than unticking clearing it.
      if (f.add !== undefined) feat |= f.add;
      continue;
    }
    if (f.pi !== undefined) pv[f.pi] = 0;
    if (f.bit !== undefined) feat &= ~f.bit;
    if (f.style === "moons") moons = 0;
    if (f.style === "dither") dither = 0;
  }
  return { feat, moons, dither, palette: parseInt($("palette").value) };
}

let emaMs = 0;
function frame() {
  angle += spin;
  const a = applyFeatures(on);
  const t0 = performance.now();
  wasm.render_features(bufPtr, NATIVE, typeIdx, seed, angle, paramsPtr, a.palette, a.dither, a.moons, a.feat);
  emaMs += (performance.now() - t0 - emaMs) * 0.08;
  const view = new Uint8Array(wasm.memory.buffer, bufPtr, bufLen);
  imgData.data.set(view);
  octx.putImageData(imgData, 0, 0);
  sctx.clearRect(0, 0, stage.width, stage.height);
  sctx.drawImage(off, 0, 0, stage.width, stage.height);
  $("labMs").textContent = emaMs.toFixed(3);
  $("labFps").textContent = emaMs > 0 ? (1000 / emaMs).toFixed(0) : "–";
  requestAnimationFrame(frame);
}

// Build the tick-boxes.
function buildFeats() {
  const host = $("feats");
  for (const f of FEATURES) {
    const lab = document.createElement("label");
    if (f.opt) lab.className = "opt";
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = true;
    cb.addEventListener("change", () => { cb.checked ? on.add(f.key) : on.delete(f.key); });
    lab.appendChild(cb);
    lab.appendChild(document.createTextNode(f.label));
    lab.title = f.opt ? "an optimization — unticking it makes the frame slower"
                      : "a feature — unticking it makes the frame cheaper";
    host.appendChild(lab);
  }
}

// Time one configuration: warm up, then take the best of a few runs, which is
// far more stable than a mean when the browser decides to do something else
// mid-measurement.
function timeConfig(set, iters) {
  const a = applyFeatures(set);
  for (let i = 0; i < 8; i++)
    wasm.render_features(bufPtr, NATIVE, typeIdx, seed, i * 0.1, paramsPtr, a.palette, a.dither, a.moons, a.feat);
  let best = Infinity;
  for (let r = 0; r < 3; r++) {
    const t0 = performance.now();
    for (let i = 0; i < iters; i++)
      wasm.render_features(bufPtr, NATIVE, typeIdx, seed, i * 0.013, paramsPtr, a.palette, a.dither, a.moons, a.feat);
    best = Math.min(best, (performance.now() - t0) / iters);
  }
  return best;
}

// Switch each feature off on its own and diff against the full frame. Yields to
// the event loop between features so the page stays alive and can show progress.
async function measure() {
  const btn = $("measure");
  btn.disabled = true;
  const iters = NATIVE >= 128 ? 25 : 60;
  const all = new Set(FEATURES.map(f => f.key));
  const full = timeConfig(all, iters);
  const rows = [];
  for (let i = 0; i < FEATURES.length; i++) {
    const f = FEATURES[i];
    btn.textContent = `measuring… ${i + 1}/${FEATURES.length}`;
    await new Promise(r => requestAnimationFrame(r));
    const without = new Set(all); without.delete(f.key);
    // A feature's cost is what vanishes when it goes. An optimization's value is
    // what comes BACK when it goes, so its sign is flipped for display.
    const d = timeConfig(without, iters);
    rows.push({ label: f.label, ms: f.opt ? d - full : full - d, opt: !!f.opt });
  }
  rows.sort((x, y) => y.ms - x.ms);
  const peak = Math.max(...rows.map(r => Math.abs(r.ms)), 1e-6);
  // A clock too coarse to resolve the batch (some browsers clamp
  // performance.now(), and a headless run can freeze it outright) would divide
  // by zero here. Show a dash rather than a column of NaN.
  const pct = ms => (full > 1e-9 ? `${(100 * ms / full).toFixed(0)}%` : "–");
  $("costs").innerHTML =
    `<table class="costs"><thead><tr><th>${NAMES[typeIdx]} @ ${NATIVE}px — full ${full.toFixed(3)} ms` +
    `</th><th>ms</th><th>%</th><th class="barw"></th></tr></thead><tbody>` +
    rows.map(r => `<tr class="${r.opt ? "opt" : ""}"><td>${r.label}${r.opt ? " ↑saves" : ""}</td>` +
      `<td class="n">${r.ms.toFixed(3)}</td><td>${pct(r.ms)}</td>` +
      `<td class="barw"><i style="width:${Math.max(0, 100 * r.ms / peak).toFixed(0)}%"></i></td></tr>`).join("") +
    `</tbody></table>`;
  btn.disabled = false;
  btn.textContent = "⏱ measure what each feature costs";
}

async function main() {
  const res = await fetch("./planet.wasm?v=" + Date.now(), { cache: "no-store" });
  const { instance } = await WebAssembly.instantiate(await res.arrayBuffer(), {});
  wasm = instance.exports;

  FEAT_ALL = wasm.feat_all();
  buildFeats();
  $("measure").addEventListener("click", measure);
  const n = wasm.type_count();
  if (n !== NAMES.length) $("sub").textContent = `warning: wasm has ${n} types, JS lists ${NAMES.length}`;
  NUM = wasm.num_params();

  NAMES.forEach((name, i) => { const o = document.createElement("option"); o.value = String(i); o.textContent = name; $("type").appendChild(o); });
  buildSliders();

  paramsPtr = wasm.alloc(NUM * 4); // stable buffer, allocated before pixel buffer
  setResolution(64);
  randomize();

  $("type").addEventListener("change", () => setType(parseInt($("type").value)));
  $("seed").addEventListener("input", () => { seed = (parseInt($("seed").value) || 0) >>> 0; $("sub").textContent = `seed ${seed} · type ${typeIdx}`; });
  $("rndseed").addEventListener("click", () => { seed = (Math.random() * 0xffffff) >>> 0; $("seed").value = seed; });
  $("gen").addEventListener("click", randomize);
  $("reset").addEventListener("click", () => loadTypeDefaults(typeIdx));
  $("res").addEventListener("input", () => setResolution(parseInt($("res").value)));
  $("spn").addEventListener("input", () => { spin = parseFloat($("spn").value); $("spnV").textContent = spin.toFixed(3); });
  $("dth").addEventListener("input", () => $("dthV").textContent = parseFloat($("dth").value).toFixed(2));
  $("crt").addEventListener("change", () => $("crtfx").classList.toggle("on", $("crt").checked));

  requestAnimationFrame(frame);
}
main().catch(e => { $("name").textContent = "failed to load wasm"; $("sub").textContent = String(e); });
</script>
</body>
</html>
